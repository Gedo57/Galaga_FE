<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#020611" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Galaga Skill Wager</title>
    <style>
      html,body,#app{margin:0;min-width:100%;min-height:100%;background:#020611}
      body{overflow:hidden}
      .startup-loader{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:clamp(24px,4vw,48px);overflow:hidden;background:#020611 url('/loading-screen-bg.png') center center / cover no-repeat;color:#f4fbff;font-family:Arial,Helvetica,sans-serif;isolation:isolate}
      .startup-loader::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,6,17,.16) 0%,rgba(2,6,17,.34) 46%,rgba(2,6,17,.82) 100%);pointer-events:none}
      .startup-loader-core{position:relative;z-index:1;width:min(760px,92vw);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
      .startup-loader-copy{color:#ffffff;font-size:clamp(20px,2.8vw,34px);font-weight:900;letter-spacing:.10em;text-transform:uppercase;text-shadow:0 0 12px rgba(53,198,255,.75),0 0 30px rgba(53,198,255,.35)}
      .startup-loader-track{position:relative;width:min(720px,90vw);height:clamp(22px,2.6vw,30px);padding:3px;border:2px solid rgba(113,224,255,.95);border-radius:999px;background:rgba(4,12,28,.82);box-shadow:0 0 18px rgba(57,190,255,.45), inset 0 0 14px rgba(0,0,0,.6);overflow:hidden}
      .startup-loader-track span{display:block;width:0;height:100%;border-radius:999px;background:linear-gradient(90deg,#1968d4 0%,#24a9ff 45%,#7aefff 100%);box-shadow:0 0 22px rgba(70,216,255,.85);transition:width .18s ease-out}
      .startup-loader-percent{min-width:72px;color:#dff8ff;font-size:clamp(22px,3vw,38px);font-weight:1000;letter-spacing:.05em;text-shadow:0 0 14px rgba(67,214,255,.75)}
      .startup-loader-count{color:rgba(225,244,255,.88);font-size:clamp(11px,1.45vw,15px);font-weight:700;letter-spacing:.10em;text-shadow:0 0 8px rgba(35,157,230,.35)}
      @media (max-width:640px){
        .startup-loader{padding:20px 14px 28px}
        .startup-loader-core{gap:10px}
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main class="startup-loader" data-startup-loader role="status" aria-live="polite">
        <div class="startup-loader-core">
          <div class="startup-loader-copy" data-loading-status>Loading....</div>
          <div class="startup-loader-track" aria-hidden="true"><span data-loading-bar></span></div>
          <div class="startup-loader-percent" data-loading-percent>0%</div>
          <div class="startup-loader-count" data-loading-count>0 / --</div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
